[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "Short-term electricity demand forecasting with Chronos"
authors = [
  { name = "Team Endesa" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "dvc>=3.67.1",
    "dvc-http>=2.32.0",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mlflow>=3.1,<4",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pyarrow>=25.0.1",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.11.0"

[project.optional-dependencies]
forecast = [
    "chronos-forecasting>=2.3.2,<3",
    "torch>=2.2,<3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pylint>=4.1.2",
    "pytest",
    "ruff",
]


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
# Quality gate: CI fails if the global score drops below this value.
fail-under = 9.0

[tool.pylint.basic]
# Private helpers and pytest test functions do not need docstrings.
no-docstring-rgx = "^(_|test_)"

[tool.pylint.format]
max-line-length = 99  # same as Ruff

[tool.pylint."messages control"]
disable = [
    "line-too-long",         # enforced by Ruff format
    "wrong-import-order",    # enforced by Ruff isort (I rules)
    "redefined-outer-name",  # pytest fixtures are injected by name
]
