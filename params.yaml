# Evaluation protocol in docs/problem-definition.md, agreed in #5 on 2026-10-03.
# Positions count 30-minute steps from the start of each series.
data:
  states: [NSW, VIC, QLD, SA, TAS]
  common_length: 230736  # shared prefix; later QLD and SA steps are dropped

split:
  train_end: 195696  # training block [0, train_end)
  validation_end: 213216  # validation [train_end, validation_end), test up to common_length

forecast:
  context_length: 512
  horizon: 48
  origin_stride: 48  # one origin per nominal day in validation and test

# Inference-only comparison for #12; keep final test targets out of model selection.
evaluation:
  model_id: amazon/chronos-t5-small
  model_revision: a971ba21945c4f1796b17a91fe69214b5f4ad472
  seed: 7
  num_samples: 20
  batch_size: 16
  device: cpu
  cpu_threads: 4
  max_seconds: 3600

# Bounded fine-tuning for #13, starting from the evaluation checkpoint above. Option 1 of
# the proposal in #13: the Chronos paper's fine-tuning schedule (Ansari et al., 2024, 5.5).
fine_tuning:
  learning_rate: 0.001  # decayed linearly to 0 over `steps`
  steps: 1000
  batch_size: 32
  micro_batch_size: 16  # gradients accumulated over batch_size / micro_batch_size; fits 8 GB
  seed: 7
  window_start: 0  # first training position a window may use; windows end before train_end
  checkpoint_every: 250
  device: cuda
  max_seconds: 1800

# Options proposed in #13; each changes one setting of `fine_tuning`. Seeds are set per run.
fine_tuning_options:
  1-reference: {}
  2-lower-lr: {learning_rate: 0.0001}
  3-fewer-steps: {steps: 300}
  4-recent-data: {window_start: 143136}  # the last three years of the training block
