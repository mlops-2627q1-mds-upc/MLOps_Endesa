name: Drift dependency checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/drift/**"
      - "src/monitoring/**"
      - "tests/test_drift*.py"
      - "monitoring/drift/**"
      - ".github/workflows/drift.yml"
  push:
    branches: [main]
    paths:
      - "src/drift/**"
      - "src/monitoring/**"
      - "tests/test_drift*.py"
      - "monitoring/drift/**"
      - ".github/workflows/drift.yml"

permissions:
  contents: read

jobs:
  alibi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"
      - name: Install isolated locked drift dependencies
        run: uv sync --project monitoring/drift --locked --dev
      - name: Require the real Alibi backend
        run: monitoring/drift/.venv/bin/python -c 'from alibi_detect.cd import KSDrift'
      - name: Run pure and real detector checks
        run: monitoring/drift/.venv/bin/python -m pytest --noconftest tests/test_drift*.py -q
