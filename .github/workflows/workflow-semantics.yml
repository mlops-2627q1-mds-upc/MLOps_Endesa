name: Workflow semantics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Workflow / semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 2 --max-time 30 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: Validate every workflow's GitHub Actions semantics
        run: |
          # Shell/Python syntax checks are separate; this gate checks Actions
          # expressions, types, allowed contexts and workflow structure.
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= -oneline
      - name: Require rejection of the unavailable runner context regression
        run: |
          log="$RUNNER_TEMP/actionlint-regression.log"
          if "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= -oneline \
            tests/fixtures/workflows/invalid-runner-job-env.yml > "$log" 2>&1; then
            echo 'The semantic validator accepted an unavailable job-env context.' >&2
            exit 1
          fi
          cat "$log"
          grep --fixed-strings 'context "runner" is not allowed here' "$log"
