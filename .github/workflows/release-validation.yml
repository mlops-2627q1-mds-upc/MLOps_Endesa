name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"
      - name: Install locked forecast dependencies
        timeout-minutes: 10
        run: uv sync --locked --dev --extra forecast
      - name: Retrieve and validate selected artifacts
        timeout-minutes: 17
        env:
          DVC_HTTP_USER: ${{ secrets.DVC_HTTP_USER }}
          DVC_HTTP_PASSWORD: ${{ secrets.DVC_HTTP_PASSWORD }}
        run: uv run --no-sync python -m src.release_validation --pull
      - name: Retain validation evidence, including failures
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            temporary/release-validation/**/report.json
            temporary/release-validation/**/identities.json
            temporary/release-validation/**/*.log
            temporary/release-validation/**/params-cpu2.yaml
            temporary/release-validation/**/minimum-functionality.json
            temporary/release-validation/**/directional/**/*.json
            temporary/release-validation/**/data-check/reports/*.json
          if-no-files-found: warn
          retention-days: 14
