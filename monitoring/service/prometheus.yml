global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/alerts.yml

scrape_configs:
  - job_name: forecast-api
    scrape_timeout: 5s
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
