  - expr: up{job="forecast-quality"}
    eval_time: 1m
    exp_samples:
    - labels: up{instance="quality:9101",job="forecast-quality"}
      value: 1
  - expr: endesa_quality_report_available{job="forecast-quality"} and on(job, instance) (up{job="forecast-quality"}
